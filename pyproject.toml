[tool.poetry]
name = "chromosome-ideogram"
version = "0.0.2"
description = "A python package for drawing genome-wide data on idiograms."
authors = ["Wenlin Xu <wenlinxu.njfu@outlook.com>"]
homepage = "https://github.com/wenlinXu-njfu/ChromosomeIdeogram"
license = "MIT"
readme = "README.md"
packages = [{include = "chromosome_ideogram"}]

[tool.poetry.dependencies]
python = ">=3.8"
numpy = ">=1.24.4"
matplotlib = ">=3.7.5"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"